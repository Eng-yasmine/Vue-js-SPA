<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lecture 1 Vue.js</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div id="app-root">
        <h1>Welcome {{ name }}</h1>
        <p>Your age is {{ age }}</p>
        <p>Your position is {{ position }}</p>
        <p>Your email is {{ email }}</p>
        <h2>{{ sayHello() }}</h2>
        <!-- to binding the link to the anchor tag or src use v-bind:href="link" or :href="link" -->
        <a class="btn btn-primary" :href="link" target="_blank">click here</a>
        <br>
        <!-- event => if you neet to use event in vue.js use @click="increment" or v-on:click="increment" -->
        <button @click="increment">increment</button>
        <br>
        <p>the number is {{ number }}</p>
        <!-- if you need to use a method that is not a method in vue.js use v-on:click="dontwork" or @click="dontwork" -->
        <button @click.prevent="dontwork">dontwork</button>
        <br>
        <!-- Use .once to execute the click handler only once -->
        <button @click.once="doOnetime">One Time</button>
        <br>
        <input type="text" @keyup="printmyname">
        <input type="text" @keyup.enter="printmyname">
        <!-- if you need to use enter key to print the name use @keyup.enter="printmyname" -->
        <input type="text" @keyup.alt.enter="printmyname">
        <!-- if you need to use alt and enter key to print the name use @keyup.alt.enter="printmyname" -->

        <div>
            <label for="name">Name</label>
            <input type="text" id="name" v-model="name">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="text" id="email" v-model="email">
        </div>


    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
